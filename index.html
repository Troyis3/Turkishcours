<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Türkçe Dilbilgisi — Грамматика турецкого языка</title>
<meta name="theme-color" content="#0a0512">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a0512;
  --void-2:#120a20;
  --violet-950:#170c2b;
  --violet-900:#20123a;
  --violet-800:#2c1850;
  --violet-700:#3d2170;
  --violet-600:#54299b;
  --orchid:#b565f5;
  --orchid-bright:#d9a8ff;
  --magenta:#e457c4;
  --ink:#eee7f8;
  --ink-dim:#b3a3d4;
  --ink-faint:#7c6c9c;
  --glass-bg:rgba(255,255,255,0.055);
  --glass-bg-strong:rgba(255,255,255,0.09);
  --glass-border:rgba(255,255,255,0.14);
  --glass-hi:rgba(255,255,255,0.5);
  --coral:#ff6b8b;
  --mint:#5fe3c4;
  --radius:20px;
  --serif:'Fraunces', Georgia, serif;
  --sans:'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:'JetBrains Mono', monospace;
  --ease:cubic-bezier(.16,.84,.44,1);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;padding:0;}
body{
  background:var(--void);
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  position:relative;
}
a{color:inherit;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
}

/* ---------- Ambient background: gradient wash + floating orbs + film grain ---------- */
.bg-wash{
  position:fixed; inset:0; z-index:-2; pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%, rgba(84,41,155,0.55), transparent 60%),
    radial-gradient(ellipse 60% 45% at 100% 15%, rgba(228,87,196,0.16), transparent 55%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(45,20,80,0.65), transparent 60%),
    linear-gradient(180deg, var(--void) 0%, var(--void-2) 45%, var(--void) 100%);
}
.orb{
  position:fixed; border-radius:50%; filter:blur(70px); pointer-events:none; z-index:-2;
  mix-blend-mode:screen; opacity:0.55;
}
.orb-1{
  width:46vw; height:46vw; max-width:640px; max-height:640px;
  background:radial-gradient(circle, rgba(181,101,245,0.75), transparent 70%);
  top:-14vw; left:-10vw;
  animation:float1 26s ease-in-out infinite alternate;
}
.orb-2{
  width:38vw; height:38vw; max-width:520px; max-height:520px;
  background:radial-gradient(circle, rgba(228,87,196,0.5), transparent 70%);
  bottom:-12vw; right:-8vw;
  animation:float2 32s ease-in-out infinite alternate;
}
.orb-3{
  width:26vw; height:26vw; max-width:380px; max-height:380px;
  background:radial-gradient(circle, rgba(95,227,196,0.28), transparent 70%);
  top:40%; left:60%;
  animation:float3 22s ease-in-out infinite alternate;
}
@keyframes float1{ from{transform:translate(0,0) scale(1);} to{transform:translate(4vw,6vw) scale(1.12);} }
@keyframes float2{ from{transform:translate(0,0) scale(1);} to{transform:translate(-5vw,-4vw) scale(1.08);} }
@keyframes float3{ from{transform:translate(0,0) scale(1);} to{transform:translate(-3vw,3vw) scale(0.92);} }

.grain{
  position:fixed; inset:-50px; z-index:-1; pointer-events:none; opacity:0.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:160px 160px;
}

/* ---------- Liquid glass primitive ---------- */
.glass{
  position:relative;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  box-shadow:
    0 1px 0 0 rgba(255,255,255,0.08) inset,
    0 30px 60px -20px rgba(5,0,15,0.55),
    0 0 0 1px rgba(255,255,255,0.02);
  transition:transform .45s var(--ease), box-shadow .45s var(--ease), border-color .45s var(--ease), background .45s var(--ease);
}
.glass::before{
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:linear-gradient(160deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 35%, rgba(255,255,255,0) 70%, rgba(181,101,245,0.25));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}
.glass:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,0.22);
  background:var(--glass-bg-strong);
  box-shadow:
    0 1px 0 0 rgba(255,255,255,0.1) inset,
    0 40px 80px -20px rgba(5,0,15,0.65),
    0 0 40px -8px rgba(181,101,245,0.35);
}

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns:296px 1fr;
  min-height:100vh;
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{
    position:fixed; z-index:50; height:100dvh; width:280px;
    transform:translateX(-105%); transition:transform .4s var(--ease);
  }
  .sidebar.open{transform:translateX(0);}
  .menu-toggle{display:flex !important;}
  .sidebar-scrim{
    display:none; position:fixed; inset:0; z-index:45; background:rgba(5,0,15,0.55);
    backdrop-filter:blur(4px); animation:fadein .3s var(--ease);
  }
  .sidebar-scrim.show{display:block;}
}

/* ---------- Sidebar ---------- */
.sidebar{
  margin:16px 0 16px 16px;
  padding:24px 16px 24px;
  overflow-y:auto;
  height:calc(100vh - 32px);
}
@media (max-width:900px){ .sidebar{margin:0; height:100dvh; border-radius:0; padding:calc(env(safe-area-inset-top) + 20px) 16px 24px;} }
.brand{
  display:flex; align-items:center; gap:12px;
  padding:4px 6px 20px;
  border-bottom:1px solid rgba(255,255,255,0.1);
  margin-bottom:16px;
}
.brand-title{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.15;}
.brand-title small{display:block; font-family:var(--mono); font-size:10px; letter-spacing:.13em; color:var(--orchid-bright); text-transform:uppercase; margin-top:4px; font-weight:500;}

.nav-group-label{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); margin:20px 8px 8px;
}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 11px; border-radius:12px; cursor:pointer;
  font-size:14px; color:var(--ink-dim); margin-bottom:3px;
  transition:background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
  position:relative; min-height:40px;
}
.nav-item:hover{background:rgba(255,255,255,0.055); color:var(--ink); transform:translateX(2px);}
.nav-item.active{
  background:linear-gradient(90deg, rgba(181,101,245,0.22), rgba(228,87,196,0.08));
  color:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,0.08) inset;
}
.nav-item.active .nav-num{background:linear-gradient(135deg, var(--orchid), var(--magenta)); color:#fff;}
.nav-num{
  flex:0 0 auto; width:23px; height:23px; border-radius:7px;
  background:rgba(255,255,255,0.07); color:var(--ink-dim);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:11px; font-weight:600;
  transition:background .25s var(--ease);
}
.nav-done{
  margin-left:auto; width:7px; height:7px; border-radius:50%;
  background:var(--mint); opacity:0; flex:0 0 auto; box-shadow:0 0 8px var(--mint);
}
.nav-item.done .nav-done{opacity:1;}
.nav-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.menu-toggle{
  display:none; position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:16px; z-index:60;
  width:44px; height:44px; border-radius:13px; color:var(--ink); align-items:center; justify-content:center;
  cursor:pointer; border:1px solid var(--glass-border); background:var(--glass-bg-strong);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}

/* ---------- Main content ---------- */
main{padding:0; position:relative;}
.page{display:none; padding:52px 56px 100px; max-width:900px; margin:0 auto;}
.page.active{display:block; animation:pagein .6s var(--ease);}
@keyframes pagein{
  from{opacity:0; transform:translateY(16px) scale(.99);}
  to{opacity:1; transform:translateY(0) scale(1);}
}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}
@media (max-width:900px){.page{padding:88px 18px 80px;}}

.reveal{animation:revealitem .7s var(--ease) both;}
@keyframes revealitem{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

/* Home hero */
.hero{position:relative; padding:74px 56px 20px;}
@media (max-width:900px){.hero{padding:20px 4px 10px;}}
.hero-eyebrow{
  font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--orchid-bright); margin-bottom:16px; display:flex; align-items:center; gap:10px;
  animation:revealitem .6s var(--ease) both;
}
.hero-eyebrow::before{content:''; width:26px; height:1px; background:var(--orchid-bright);}
.hero h1{
  font-family:var(--serif); font-size:clamp(36px,5.4vw,60px); line-height:1.03; font-weight:600;
  margin:0 0 22px; max-width:12ch;
  animation:revealitem .7s var(--ease) both; animation-delay:.08s;
}
.hero h1 em{
  font-style:normal; background:linear-gradient(120deg, var(--orchid-bright), var(--magenta));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero p{
  font-size:16.5px; line-height:1.68; color:var(--ink-dim); max-width:56ch; margin:0 0 32px;
  animation:revealitem .7s var(--ease) both; animation-delay:.16s;
}
.hero-stats{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; animation:revealitem .7s var(--ease) both; animation-delay:.24s;}
.stat{padding:16px 22px; border-radius:16px; min-width:110px;}
.stat b{display:block; font-family:var(--serif); font-size:27px; background:linear-gradient(120deg,var(--orchid-bright),var(--mint)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.stat span{font-size:12px; color:var(--ink-dim);}
.cta-row{display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; animation:revealitem .7s var(--ease) both; animation-delay:.32s;}
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:14px 24px; border-radius:14px;
  font-weight:700; font-size:14.5px; cursor:pointer; border:1px solid transparent; text-decoration:none;
  transition:transform .35s var(--ease), box-shadow .35s var(--ease), background .35s var(--ease); font-family:var(--sans);
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(120deg, var(--orchid), var(--magenta)); color:#fff;
  box-shadow:0 10px 30px -8px rgba(181,101,245,0.55);
}
.btn-primary:hover{box-shadow:0 14px 40px -6px rgba(228,87,196,0.6); transform:translateY(-2px);}
.btn-ghost{border-color:var(--glass-border); color:var(--ink); background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);}
.btn-ghost:hover{border-color:rgba(255,255,255,0.3); transform:translateY(-2px);}

.section-block{padding:36px 56px;}
@media (max-width:900px){.section-block{padding:30px 4px;}}
.level-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:26px;}
@media (max-width:760px){.level-grid{grid-template-columns:1fr;}}
.level-card{padding:24px;}
.level-card h3{font-family:var(--serif); margin:0 0 8px; font-size:19px;}
.level-card p{color:var(--ink-dim); font-size:13.5px; line-height:1.55; margin:0 0 14px;}
.level-card ul{margin:0; padding:0; list-style:none; font-size:13px; color:var(--ink-dim);}
.level-card li{padding:6px 4px; border-radius:8px; border-top:1px dashed rgba(255,255,255,.08); cursor:pointer; transition:background .2s var(--ease), color .2s var(--ease), padding-left .2s var(--ease);}
.level-card li:first-child{border-top:none;}
.level-card li:hover{color:var(--orchid-bright); padding-left:9px; background:rgba(255,255,255,0.04);}

/* Lesson page */
.lesson-kicker{
  font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--orchid-bright); margin-bottom:10px;
}
.lesson-title{font-family:var(--serif); font-size:clamp(28px,4vw,40px); margin:0 0 10px; font-weight:600;}
.lesson-subtitle{color:var(--ink-dim); font-size:16px; margin:0 0 36px; line-height:1.55;}

.theory-block{margin-bottom:24px; padding:26px 28px; animation:revealitem .6s var(--ease) both;}
.theory-block:nth-of-type(1){animation-delay:.03s;}
.theory-block:nth-of-type(2){animation-delay:.09s;}
.theory-block:nth-of-type(3){animation-delay:.15s;}
.theory-block:nth-of-type(4){animation-delay:.21s;}
.theory-block:nth-of-type(5){animation-delay:.27s;}
.theory-block h3{
  font-family:var(--serif); font-size:20px; margin:0 0 12px; color:var(--ink);
  display:flex; align-items:center; gap:10px;
}
.theory-block h3::before{content:''; width:14px; height:14px; background:linear-gradient(135deg,var(--orchid),var(--magenta)); border-radius:4px; flex:0 0 auto; transform:rotate(45deg);}
.theory-block p, .theory-block li{font-size:15px; line-height:1.75; color:#d8cfec;}
.theory-block ul{padding-left:20px;}
.theory-block table{width:100%; border-collapse:collapse; margin:14px 0; font-size:14px;}
.theory-block th, .theory-block td{border:1px solid rgba(255,255,255,.09); padding:9px 12px; text-align:left;}
.theory-block th{background:rgba(255,255,255,.045); font-family:var(--mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--orchid-bright); font-weight:600;}
.tr{font-family:var(--mono); color:var(--mint); font-weight:600;}
.suffix{color:var(--orchid-bright); font-family:var(--mono); font-weight:600;}

.nuance{
  background:linear-gradient(90deg, rgba(255,107,139,.12), transparent);
  border-left:3px solid var(--coral); border-radius:0 14px 14px 0;
  padding:15px 20px; margin:16px 0; font-size:14px; line-height:1.6; color:#f5dbe2;
}
.nuance b{color:#ffb3c7;}

.examples{padding:22px 24px; margin:20px 0;}
.example-row{
  display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:10px 0;
  border-top:1px dashed rgba(255,255,255,.08); font-size:14.5px;
}
.example-row:first-child{border-top:none;}
@media (max-width:600px){.example-row{grid-template-columns:1fr;}}
.example-row .ru{color:var(--ink-dim);}

/* Exercises */
.exercise-wrap{
  margin-top:46px; padding-top:30px; border-top:1px solid rgba(255,255,255,.1);
}
.exercise-wrap > .lesson-kicker{margin-bottom:4px;}
.ex-card{padding:24px; margin-bottom:18px;}
.ex-q{font-size:15.5px; margin:0 0 14px; line-height:1.55;}
.ex-options{display:flex; flex-direction:column; gap:9px;}
.ex-opt{
  display:flex; align-items:center; gap:10px; padding:12px 15px; border-radius:12px;
  border:1px solid rgba(255,255,255,.1); cursor:pointer; font-size:14.5px;
  transition:border-color .25s var(--ease), background .25s var(--ease), transform .2s var(--ease);
  background:rgba(255,255,255,0.02);
}
.ex-opt:hover{border-color:var(--orchid); transform:translateX(3px); background:rgba(181,101,245,0.08);}
.ex-opt.selected{border-color:var(--orchid); background:rgba(181,101,245,.12);}
.ex-opt.correct{border-color:var(--mint); background:rgba(95,227,196,.15); box-shadow:0 0 20px -6px rgba(95,227,196,.5);}
.ex-opt.wrong{border-color:var(--coral); background:rgba(255,107,139,.14);}
.ex-input-row{display:flex; gap:10px; flex-wrap:wrap;}
.ex-input{
  background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,.15); border-radius:12px;
  padding:12px 15px; color:var(--ink); font-family:var(--mono); font-size:14.5px; flex:1; min-width:180px;
  transition:border-color .25s var(--ease);
}
.ex-input:focus{outline:none; border-color:var(--orchid);}
.ex-check{
  background:linear-gradient(120deg, var(--orchid), var(--magenta)); color:#fff; border:none; border-radius:12px;
  padding:12px 20px; font-weight:700; cursor:pointer; font-size:13.5px; transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.ex-check:hover{transform:translateY(-2px); box-shadow:0 10px 24px -8px rgba(228,87,196,.6);}
.ex-feedback{
  margin-top:14px; font-size:13.5px; padding:12px 16px; border-radius:12px; display:none; line-height:1.55;
  animation:revealitem .35s var(--ease) both;
}
.ex-feedback.show{display:block;}
.ex-feedback.ok{background:rgba(95,227,196,.12); color:#a8f3e0; border:1px solid rgba(95,227,196,.3);}
.ex-feedback.bad{background:rgba(255,107,139,.12); color:#ffc2d1; border:1px solid rgba(255,107,139,.3);}

.lesson-footer-nav{
  display:flex; justify-content:space-between; align-items:center; margin-top:50px; padding-top:24px;
  border-top:1px solid rgba(255,255,255,.1); gap:12px; flex-wrap:wrap;
}

.progress-pill{
  display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px;
  color:var(--ink-dim); padding:8px 14px; border-radius:20px;
}
.progress-pill b{color:var(--orchid-bright);}

/* ---------- Content cards share the liquid-glass surface ---------- */
.theory-block,
.examples,
.ex-card,
.stat,
.level-card{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 1px 0 0 rgba(255,255,255,0.07) inset, 0 20px 45px -22px rgba(5,0,15,0.6);
  position:relative;
  transition:transform .4s var(--ease), box-shadow .4s var(--ease), border-color .4s var(--ease), background .4s var(--ease);
}
.ex-card:hover, .level-card:hover{
  transform:translateY(-2px);
  border-color:rgba(255,255,255,0.22);
  background:var(--glass-bg-strong);
  box-shadow:0 1px 0 0 rgba(255,255,255,0.1) inset, 0 28px 55px -20px rgba(5,0,15,0.65);
}

::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(181,101,245,.3); border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(181,101,245,.5);}


/* ---------- AI tutor page ---------- */
.ai-shell{padding:28px;overflow:hidden;}
.ai-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px;}
.ai-head h2{font-family:var(--serif);font-size:clamp(25px,4vw,36px);margin:0 0 8px;font-weight:600;}
.ai-head p{margin:0;color:var(--ink-dim);line-height:1.6;max-width:58ch;}
.ai-status{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;background:rgba(95,227,196,.10);border:1px solid rgba(95,227,196,.25);color:var(--mint);font-size:12px;white-space:nowrap;}
.ai-status::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;}
.ai-suggestions{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 18px;}
.ai-chip{border:1px solid var(--glass-border);background:rgba(255,255,255,.045);color:var(--ink-dim);padding:9px 12px;border-radius:999px;font:600 12px var(--sans);cursor:pointer;transition:.25s var(--ease);}
.ai-chip:hover{color:var(--ink);border-color:rgba(181,101,245,.5);background:rgba(181,101,245,.12);transform:translateY(-1px);}
.ai-messages{height:min(54vh,520px);min-height:360px;overflow-y:auto;padding:18px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:rgba(5,0,15,.25);display:flex;flex-direction:column;gap:13px;scroll-behavior:smooth;}
.ai-row{display:flex;gap:10px;align-items:flex-end;}
.ai-row.user{justify-content:flex-end;}
.ai-avatar{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:14px;background:linear-gradient(135deg,var(--orchid),var(--magenta));box-shadow:0 8px 20px -10px rgba(181,101,245,.8);}
.ai-bubble{max-width:min(82%,680px);padding:12px 15px;border-radius:16px;line-height:1.58;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere;}
.ai-row.bot .ai-bubble{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.10);border-bottom-left-radius:5px;}
.ai-row.user .ai-bubble{background:linear-gradient(120deg,rgba(181,101,245,.92),rgba(228,87,196,.88));color:#fff;border-bottom-right-radius:5px;}
.ai-row.error .ai-bubble{background:rgba(255,107,139,.12);border:1px solid rgba(255,107,139,.25);color:#ffabc0;}
.ai-typing{display:inline-flex;gap:5px;align-items:center;min-height:20px;}
.ai-typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-dim);animation:aiDot 1s infinite ease-in-out;}
.ai-typing i:nth-child(2){animation-delay:.15s}.ai-typing i:nth-child(3){animation-delay:.3s}
@keyframes aiDot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
.ai-compose{display:flex;gap:10px;margin-top:14px;align-items:flex-end;}
.ai-compose textarea{flex:1;min-height:54px;max-height:150px;resize:none;padding:15px 16px;border-radius:16px;border:1px solid var(--glass-border);background:rgba(255,255,255,.055);color:var(--ink);font:500 14.5px/1.45 var(--sans);outline:none;transition:border-color .25s,box-shadow .25s;}
.ai-compose textarea:focus{border-color:rgba(181,101,245,.65);box-shadow:0 0 0 3px rgba(181,101,245,.10);}
.ai-send{width:54px;height:54px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--orchid),var(--magenta));color:white;cursor:pointer;font-size:20px;font-weight:800;box-shadow:0 12px 28px -10px rgba(181,101,245,.65);transition:.25s var(--ease);}
.ai-send:hover{transform:translateY(-2px)}.ai-send:disabled{opacity:.45;cursor:wait;transform:none;}
.ai-note{font-size:11.5px;color:var(--ink-faint);margin:10px 2px 0;line-height:1.5;}
.ai-clear{border:0;background:none;color:var(--ink-faint);font:600 12px var(--sans);cursor:pointer;padding:8px;}
.ai-clear:hover{color:var(--coral)}
@media(max-width:650px){.ai-shell{padding:18px 14px}.ai-head{display:block}.ai-status{margin-top:13px}.ai-messages{min-height:390px;height:58vh;padding:12px}.ai-bubble{max-width:90%}.ai-avatar{display:none}.ai-compose textarea{min-height:52px}.ai-send{width:52px;height:52px}}
/* ---------- Chat History ---------- */

.ai-layout{
display:grid;
grid-template-columns:260px 1fr;
gap:18px;
height:min(72vh,760px);
}

.ai-sidebar{
display:flex;
flex-direction:column;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
overflow:hidden;
}

.ai-chat-header{
padding:14px;
border-bottom:1px solid rgba(255,255,255,.08);
}

.ai-new-chat{
width:100%;
padding:12px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
background:linear-gradient(135deg,var(--orchid),var(--magenta));
color:#fff;
}

.ai-chat-list{
flex:1;
overflow-y:auto;
padding:10px;
}

.ai-chat-item{
padding:12px;
margin-bottom:8px;
border-radius:12px;
cursor:pointer;
background:rgba(255,255,255,.03);
transition:.2s;
}

.ai-chat-item:hover{
background:rgba(255,255,255,.08);
}

.ai-chat-item.active{
background:rgba(181,101,245,.25);
border:1px solid rgba(181,101,245,.5);
}

.ai-chat-title{
font-weight:600;
font-size:14px;
}

.ai-chat-date{
font-size:11px;
opacity:.6;
margin-top:4px;
}

.ai-main{
display:flex;
flex-direction:column;
min-width:0;
}

@media(max-width:900px){
.ai-layout{
grid-template-columns:1fr;
}
.ai-sidebar{
height:220px;
}
}
</style>
